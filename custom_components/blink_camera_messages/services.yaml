speak:
  name: Speak through Blink camera
  description: Generate a voice message and play it through a Blink camera.
  fields:
    camera:
      name: Camera ID
      description: Stable camera ID returned by the List cameras action.
      required: true
      selector:
        text:
    message:
      name: Message
      required: true
      selector:
        text:
cameras:
  name: List cameras
  description: Return the camera IDs and names reported by BlinkBridge.
